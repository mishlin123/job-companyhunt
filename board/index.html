<title>Job Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one sticky control bar (search + status filters), then a single column of role rows,
   each with a fit stripe on the left and its decision buttons underneath. Accent is phycocyanin blue. */
:root {
  --bg: #f6f8fb;
  --surface: #ffffff;
  --ink: #16202e;
  --muted: #5d6b7e;
  --line: #dde3ec;
  --accent: #1b5fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e4edfc;
  --strong: #1b5fd1;
  --possible: #2f9a8a;
  --signal: #a6b0bf;
  --applied: #1e8a4c;
  --applied-soft: #e2f4ea;
  --hidden: #8a93a1;
  --warn: #b5560f;
  --warn-soft: #fcefe3;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #171e29; --ink: #e6ebf3; --muted: #93a0b3; --line: #2a3443;
    --accent: #6d9ef2; --accent-ink: #0b1220; --accent-soft: #1d2c46;
    --strong: #6d9ef2; --possible: #4fc0ad; --signal: #5b6676;
    --applied: #52c785; --applied-soft: #16301f; --hidden: #7d8796;
    --warn: #f0a15e; --warn-soft: #3a2614;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --ink: #e6ebf3; --muted: #93a0b3; --line: #2a3443;
  --accent: #6d9ef2; --accent-ink: #0b1220; --accent-soft: #1d2c46;
  --strong: #6d9ef2; --possible: #4fc0ad; --signal: #5b6676;
  --applied: #52c785; --applied-soft: #16301f; --hidden: #7d8796;
  --warn: #f0a15e; --warn-soft: #3a2614;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 48px; }
header.top h1 { font-family: var(--display); font-size: 28px; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header.top p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line);
}
.search { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 13px/1 var(--body); padding: 8px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.75; }
.status-line { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.status-line.err { color: var(--warn); }
.list { display: grid; gap: 10px; margin-top: 14px; }
.empty { padding: 28px 4px; color: var(--muted); text-align: center; }
.role {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--signal);
  border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0;
}
.role[data-fit="strong"] { border-left-color: var(--strong); }
.role[data-fit="possible"] { border-left-color: var(--possible); }
.role.decided { opacity: 0.92; }
.role .co { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.role h2 { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; margin: 2px 0 0; overflow-wrap: anywhere; }
.role h2 a { color: inherit; text-decoration: none; }
.role h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.meta .fit { font-family: var(--mono); font-size: 12px; text-transform: lowercase; }
.meta .soon { color: var(--warn); font-weight: 600; }
.notes { font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--accent); width: fit-content; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn {
  font: 500 13px/1 var(--body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: transparent; color: var(--muted); padding-inline: 6px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.pill { font: 600 12px/1 var(--body); padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.applied, .pill.interviewing, .pill.offer { background: var(--applied-soft); color: var(--applied); }
.pill.ineligible, .pill.off-path, .pill.ignore, .pill.rejected { background: var(--line); color: var(--muted); }
.pill.notfound { background: var(--warn-soft); color: var(--warn); }
.confirm { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.more-btn { justify-self: center; margin-top: 6px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tab {
  font: 600 14px/1 var(--body); padding: 10px 12px 11px; border: 0; border-bottom: 2px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.draft {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink);
  font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.goal { margin: 0; font-size: 14px; }
.goal b { font-weight: 600; }
.role[data-fit="event"] { border-left-color: var(--possible); }
.role[data-fit="outreach"] { border-left-color: var(--accent); }
.pill.sent, .pill.going, .pill.attended { background: var(--applied-soft); color: var(--applied); }
.pill.replied, .pill.meeting { background: var(--applied); color: var(--surface); }
.pill.skipped, .pill.no-reply, .pill.not-going { background: var(--line); color: var(--muted); }
.pill.interested { background: var(--accent-soft); color: var(--accent); }
.linkbtn { font: 500 13px/1 var(--body); color: var(--accent); text-decoration: none; padding: 9px 6px; }
.linkbtn:hover { text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .role { transition: opacity .15s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Job Shortlist</h1>
    <p id="sub">Mark what you've applied for, what you can't do and what isn't your path, which messages you've sent and which events you'll go to. Each scan picks up your clicks.</p>
  </header>

  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Section"></nav>
    <input id="q" class="search" type="search" placeholder="Search company, role or place" autocomplete="off" aria-label="Search roles">
    <div class="chips" id="chips" role="group" aria-label="Show"></div>
    <div class="status-line" id="status" aria-live="polite">Loading roles…</div>
  </div>

  <div class="list" id="list"></div>
  <button class="btn more-btn" id="more" hidden>Show more</button>
</div>

<script>
(() => {
  const LABEL = { applied: "Applied", interviewing: "Interviewing", offer: "Offer", rejected: "Rejected",
                  ineligible: "Not eligible", "off-path": "Not my path", ignore: "Not interested" };
  const FILTERS = [
    { id: "todo", label: "To decide", test: r => r.dec === "open" && r.fit !== "signal" },
    { id: "signal", label: "Signal", test: r => r.dec === "open" && r.fit === "signal" },
    { id: "applied", label: "Applied", test: r => ["applied", "interviewing", "offer", "rejected"].includes(r.dec) },
    { id: "hidden", label: "Hidden", test: r => ["ineligible", "off-path", "ignore"].includes(r.dec) },
  ];
  const OUT_LABEL = { suggested: "To send", sent: "Sent", replied: "Replied", meeting: "Meeting booked", "no-reply": "No reply", skipped: "Skipped" };
  const EVENT_LABEL = { upcoming: "Not decided", interested: "Interested", going: "Going", "not-going": "Not going", attended: "Attended" };
  const VIEW_FILTERS = {
    roles: FILTERS,
    outreach: [
      { id: "send", label: "To send", test: o => o.st === "suggested" },
      { id: "sent", label: "Sent", test: o => ["sent", "replied", "meeting", "no-reply"].includes(o.st) },
      { id: "skipped", label: "Skipped", test: o => o.st === "skipped" },
    ],
    events: [
      { id: "next", label: "Coming up", test: e => ["upcoming", "interested", "going"].includes(e.st) },
      { id: "going", label: "Going", test: e => ["going", "attended"].includes(e.st) },
      { id: "no", label: "Not going", test: e => e.st === "not-going" },
    ],
  };
  const VIEWS = [{ id: "roles", label: "Roles" }, { id: "outreach", label: "Outreach" }, { id: "events", label: "Events" }];
  const PAGE = 60;
  const state = { roles: [], outreach: [], events: [], decisions: new Map(), marks: { outreach: new Map(), events: new Map() },
                  view: "roles", filters: { roles: "todo", outreach: "send", events: "next" },
                  q: "", shown: PAGE, db: null, canWrite: true, confirming: null };
  const $ = id => document.getElementById(id);
  try {
    const f = localStorage.getItem("board-filter"); if (FILTERS.some(x => x.id === f)) state.filters.roles = f;
    const v = localStorage.getItem("board-view"); if (VIEWS.some(x => x.id === v)) state.view = v;
  } catch (e) {}
  const markOf = (kind, item) => (state.marks[kind].get(item.id) || {}).status || item.status;

  const companyKey = name => "company:" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 180);

  function decisionFor(r) {
    const own = state.decisions.get(r.id);
    if (own) return own.status;
    const co = state.decisions.get(companyKey(r.company));
    if (co && co.status !== "open") return co.status;
    if (["applied", "interviewing", "offer", "rejected", "ineligible", "off-path", "ignore"].includes(r.status)) return r.status;
    return "open";
  }

  function daysTo(d) {
    if (!d) return null;
    const t = Date.parse(d + "T23:59:59");
    return isNaN(t) ? null : Math.ceil((t - Date.now()) / 86400000);
  }
  const fmtDate = d => { const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-NZ", { day: "numeric", month: "short" }); };

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k);
    return n;
  }

  function matches(r) {
    if (!state.q) return true;
    const hay = (r.company + " " + r.role + " " + (r.location || "")).toLowerCase();
    return state.q.split(/\s+/).every(w => hay.includes(w));
  }

  function items(view) {
    if (view === "roles") { for (const r of state.roles) r.dec = decisionFor(r); return state.roles; }
    for (const x of state[view]) x.st = markOf(view, x);
    return state[view];
  }

  function renderTabs() {
    const counts = { roles: items("roles").filter(FILTERS[0].test).length,
                     outreach: items("outreach").filter(VIEW_FILTERS.outreach[0].test).length,
                     events: items("events").filter(VIEW_FILTERS.events[0].test).length };
    $("tabs").replaceChildren(...VIEWS.map(v => el("button", {
      class: "tab", role: "tab", "aria-selected": String(state.view === v.id),
      onclick: () => { state.view = v.id; state.shown = PAGE; state.confirming = null; try { localStorage.setItem("board-view", v.id); } catch (e) {} render(); }
    }, v.label, el("span", { class: "n" }, String(counts[v.id])))));
    $("q").placeholder = { roles: "Search company, role or place", outreach: "Search company or reason", events: "Search event, place or employer" }[state.view];
  }

  function renderChips() {
    const set = VIEW_FILTERS[state.view], list = items(state.view);
    const counts = Object.fromEntries(set.map(f => [f.id, list.filter(f.test).length]));
    $("chips").replaceChildren(...set.map(f => el("button", {
      class: "chip", "aria-pressed": String(state.filters[state.view] === f.id),
      onclick: () => { state.filters[state.view] = f.id; state.shown = PAGE; state.confirming = null;
                       if (state.view === "roles") try { localStorage.setItem("board-filter", f.id); } catch (e) {}
                       render(); }
    }, f.label, el("span", { class: "n" }, String(counts[f.id])))));
  }

  async function saveMark(kind, item, status) {
    if (!state.db) return;
    const prev = state.marks[kind].get(item.id);
    const body = { status, at: new Date().toISOString() };
    state.marks[kind].set(item.id, body);
    render();
    try {
      await state.db.collection(kind).doc(item.id).set(body);
      setStatus("Saved. The next scan will pick this up.");
    } catch (e) {
      if (prev) state.marks[kind].set(item.id, prev); else state.marks[kind].delete(item.id);
      if (e && e.code === "invalid_argument") state.canWrite = false;
      setStatus(e && e.code === "invalid_argument" ? "You can view this list but not change it." : "Couldn't save that. Check your connection and try again.", true);
      render();
    }
  }

  async function copyDraft(o, node) {
    try { await navigator.clipboard.writeText(o.draft); setStatus("Draft copied. Paste it into LinkedIn or your email, then mark it sent."); }
    catch (e) {
      const range = document.createRange(); range.selectNodeContents(node);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      setStatus("Copying isn't allowed here, so the draft is selected. Copy it with your keyboard.");
    }
  }

  function outreachRow(o) {
    const off = !state.db || !state.canWrite;
    const b = (label, status, primary) => el("button", { class: "btn" + (primary ? " primary" : ""), disabled: off, onclick: () => saveMark("outreach", o, status) }, label);
    const draft = el("p", { class: "draft" }, o.draft);
    const meta = [el("span", {}, `Contact: ${o.contact || "someone in the relevant team"}`)];
    if (o.channel) meta.push(el("span", {}, `via ${o.channel}`));
    if (o.created) meta.push(el("span", {}, `suggested ${fmtDate(o.created)}`));
    let actions;
    if (o.st === "suggested") actions = [b("Mark sent", "sent", true), b("Skip", "skipped")];
    else {
      actions = [el("span", { class: "pill " + o.st }, OUT_LABEL[o.st] || o.st)];
      if (o.st === "sent") actions.push(b("Replied", "replied"), b("Meeting booked", "meeting"), b("No reply", "no-reply"));
      if (o.st === "replied") actions.push(b("Meeting booked", "meeting"));
      actions.push(el("button", { class: "btn quiet", disabled: off, onclick: () => saveMark("outreach", o, "suggested") }, "Undo"));
    }
    return el("article", { class: "role" + (o.st === "skipped" ? " decided" : ""), "data-fit": "outreach" },
      el("div", {}, el("div", { class: "co" }, o.company),
        el("h2", {}, o.trigger_url ? el("a", { href: o.trigger_url, target: "_blank", rel: "noopener" }, o.trigger) : o.trigger)),
      el("div", { class: "meta" }, meta),
      draft,
      el("div", { class: "actions" },
        el("button", { class: "btn", onclick: () => copyDraft(o, draft) }, "Copy draft"),
        o.linkedin_search ? el("a", { class: "linkbtn", href: o.linkedin_search, target: "_blank", rel: "noopener" }, "Find people on LinkedIn") : null),
      o.notes ? el("details", { class: "more" }, el("summary", {}, "Why now"), el("p", { class: "notes" }, o.notes)) : null,
      el("div", { class: "actions" }, actions));
  }

  function eventRow(e) {
    const off = !state.db || !state.canWrite;
    const b = (label, status, primary) => el("button", { class: "btn" + (primary ? " primary" : ""), disabled: off, onclick: () => saveMark("events", e, status) }, label);
    const meta = [el("span", {}, fmtDate(e.start) + (e.end && e.end !== e.start ? ` – ${fmtDate(e.end)}` : ""))];
    if (e.location) meta.push(el("span", {}, e.location));
    if (e.type) meta.push(el("span", { class: "fit" }, e.type));
    if (e.cost) meta.push(el("span", {}, e.cost));
    for (const [field, label] of [["register_by", "register by"], ["abstract_deadline", "abstracts by"]]) {
      const d = daysTo(e[field]);
      if (d !== null && d >= 0) meta.push(el("span", { class: d <= 14 ? "soon" : "" }, `${label} ${fmtDate(e[field])}`));
    }
    if (e.confidence && e.confidence !== "confirmed") meta.push(el("span", { class: "pill notfound" }, `dates ${e.confidence}`));
    let actions;
    if (["upcoming", "interested"].includes(e.st)) {
      actions = [b("Going", "going", true)];
      if (e.st === "upcoming") actions.push(b("Interested", "interested"));
      else actions.push(el("span", { class: "pill interested" }, "Interested"));
      actions.push(b("Not going", "not-going"));
    } else {
      actions = [el("span", { class: "pill " + e.st }, EVENT_LABEL[e.st] || e.st)];
      if (e.st === "going" && daysTo(e.start) !== null && daysTo(e.start) <= 0) actions.push(b("Attended", "attended"));
      actions.push(el("button", { class: "btn quiet", disabled: off, onclick: () => saveMark("events", e, "upcoming") }, "Undo"));
    }
    return el("article", { class: "role" + (e.st === "not-going" ? " decided" : ""), "data-fit": "event" },
      el("div", {}, el("div", { class: "co" }, e.format || "event"),
        el("h2", {}, e.url ? el("a", { href: e.url, target: "_blank", rel: "noopener" }, e.name) : e.name)),
      el("div", { class: "meta" }, meta),
      e.goal ? el("p", { class: "goal" }, el("b", {}, "Goal: "), e.goal) : null,
      (e.employers || e.notes) ? el("details", { class: "more" }, el("summary", {}, "Who'll be there"),
        el("p", { class: "notes" }, [e.employers, e.notes].filter(Boolean).join(" · "))) : null,
      el("div", { class: "actions" }, actions));
  }

  async function save(key, body) {
    if (!state.db) return;
    const prev = state.decisions.get(key);
    state.decisions.set(key, body);
    render();
    try {
      await state.db.collection("decisions").doc(key).set(body);
      setStatus("Saved. The next scan will pick this up.");
    } catch (e) {
      if (prev) state.decisions.set(key, prev); else state.decisions.delete(key);
      if (e && e.code === "invalid_argument") state.canWrite = false;
      setStatus(e && e.code === "invalid_argument" ? "You can view this list but not change it." : "Couldn't save that. Check your connection and try again.", true);
      render();
    }
  }
  const decide = (r, status) => save(r.id, { status, role_id: r.id, company: r.company, role: r.role, at: new Date().toISOString() });
  const decideCompany = (r, status) => save(companyKey(r.company), { status, scope: "company", company: r.company, at: new Date().toISOString() });

  function actionsFor(r) {
    const off = !state.db || !state.canWrite;
    if (state.confirming === r.id) {
      return el("div", { class: "confirm" }, `Hide every role at ${r.company}, including future ones?`,
        el("button", { class: "btn primary", disabled: off, onclick: () => { state.confirming = null; decideCompany(r, "ignore"); } }, "Hide company"),
        el("button", { class: "btn quiet", onclick: () => { state.confirming = null; render(); } }, "Cancel"));
    }
    const co = state.decisions.get(companyKey(r.company));
    if (r.dec === "open") {
      return el("div", { class: "actions" },
        el("button", { class: "btn primary", disabled: off, onclick: () => decide(r, "applied") }, "Applied"),
        el("button", { class: "btn", disabled: off, onclick: () => decide(r, "ineligible") }, "Not eligible"),
        el("button", { class: "btn", disabled: off, title: "Doesn't fit my skills or career direction", onclick: () => decide(r, "off-path") }, "Not my path"),
        el("button", { class: "btn", disabled: off, onclick: () => decide(r, "ignore") }, "Not interested"),
        el("button", { class: "btn quiet", disabled: off, onclick: () => { state.confirming = r.id; render(); } }, "Hide company"));
    }
    const viaCompany = !state.decisions.get(r.id) && co && co.status !== "open";
    const kids = [el("span", { class: "pill " + r.dec }, LABEL[r.dec] + (viaCompany ? " (whole company)" : ""))];
    if (["applied", "interviewing"].includes(r.dec)) {
      if (r.dec === "applied") kids.push(el("button", { class: "btn", disabled: off, onclick: () => decide(r, "interviewing") }, "Interviewing"));
      kids.push(el("button", { class: "btn", disabled: off, onclick: () => decide(r, "offer") }, "Offer"));
      kids.push(el("button", { class: "btn", disabled: off, onclick: () => decide(r, "rejected") }, "Rejected"));
    }
    kids.push(viaCompany
      ? el("button", { class: "btn quiet", disabled: off, onclick: () => decideCompany(r, "open") }, "Show company again")
      : el("button", { class: "btn quiet", disabled: off, onclick: () => decide(r, "open") }, "Undo"));
    return el("div", { class: "actions" }, kids);
  }

  function row(r) {
    const days = daysTo(r.closes);
    const meta = [el("span", { class: "fit" }, r.fit)];
    if (r.location) meta.push(el("span", {}, r.location));
    if (r.closes && days !== null && days >= 0) meta.push(el("span", { class: days <= 7 ? "soon" : "" }, `closes ${fmtDate(r.closes)}` + (days <= 7 ? ` (${days === 0 ? "today" : days + "d"})` : "")));
    else if (r.closes) meta.push(el("span", {}, `closed ${fmtDate(r.closes)}?`));
    if (r.starts) meta.push(el("span", {}, `starts ${r.starts}`));
    if (r.status === "not-found") meta.push(el("span", { class: "pill notfound" }, "not seen last scan"));
    return el("article", { class: "role" + (r.dec !== "open" ? " decided" : ""), "data-fit": r.fit },
      el("div", {}, el("div", { class: "co" }, r.company),
        el("h2", {}, r.url ? el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.role) : r.role)),
      el("div", { class: "meta" }, meta),
      r.notes ? el("details", { class: "more" }, el("summary", {}, "Why it was flagged"), el("p", { class: "notes" }, r.notes)) : null,
      actionsFor(r));
  }

  function searchable(view, x) {
    if (view === "roles") return matches(x);
    if (!state.q) return true;
    const hay = (view === "outreach" ? [x.company, x.trigger, x.contact] : [x.name, x.location, x.employers]).join(" ").toLowerCase();
    return state.q.split(/\s+/).every(w => hay.includes(w));
  }

  const EMPTY = {
    todo: "Nothing left to decide. New roles appear here after each scan.",
    signal: "No signal-level roles open.", applied: "Nothing marked as applied yet. Tap Applied on a role once you've sent an application.",
    hidden: "Nothing hidden yet. Roles you mark Not eligible, Not my path or Not interested move here.",
    send: "No messages waiting. Each scan suggests up to three people to contact, drafted from that week's news and intakes.",
    sent: "Nothing sent yet. Copy a draft, send it yourself on LinkedIn or by email, then tap Mark sent.",
    skipped: "Nothing skipped.",
    next: "No events in the calendar yet. Scans add conferences, careers fairs and webinars as they find them.",
    going: "You haven't marked any events as Going.", no: "Nothing marked Not going.",
  };

  function render() {
    renderTabs();
    renderChips();
    const view = state.view, filter = state.filters[view];
    const f = VIEW_FILTERS[view].find(x => x.id === filter);
    const list = items(view).filter(x => f.test(x) && searchable(view, x));
    // Roles: soonest deadline first, then no deadline, then deadlines that have already passed.
    const urgency = r => { const d = daysTo(r.closes); return d === null ? 999 : d < 0 ? 2000 - d : d; };
    if (view === "roles" && filter === "todo") list.sort((a, b) => (a.fit === b.fit ? 0 : a.fit === "strong" ? -1 : 1) || urgency(a) - urgency(b));
    if (view === "events") list.sort((a, b) => (a.start || "9").localeCompare(b.start || "9"));
    if (view === "outreach") list.sort((a, b) => (b.created || "").localeCompare(a.created || ""));
    const draw = { roles: row, outreach: outreachRow, events: eventRow }[view];
    if (!list.length) $("list").replaceChildren(el("p", { class: "empty" }, state.q ? "Nothing matches that search." : EMPTY[filter]));
    else $("list").replaceChildren(...list.slice(0, state.shown).map(draw));
    const more = $("more");
    more.hidden = list.length <= state.shown;
    more.textContent = `Show more (${list.length - state.shown} left)`;
  }

  function setStatus(text, err = false) { const s = $("status"); s.textContent = text; s.classList.toggle("err", err); }

  $("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); state.shown = PAGE; render(); });
  $("more").addEventListener("click", () => { state.shown += PAGE; render(); });

  async function boot() {
    try {
      const res = await fetch("roles.json");
      const data = await res.json();
      state.roles = data.roles;
      state.outreach = data.outreach || [];
      state.events = data.events || [];
      setStatus(`${state.roles.length} roles from the scan of ${fmtDate(data.exported)}.`);
    } catch (e) {
      setStatus("Couldn't load the role list. Reload the page to try again.", true);
    }
    render();
    const claude = window.claude;
    const db = claude && claude.use ? await claude.use("db") : null;
    if (!db) {
      setStatus("Your choices can't be saved in this view. Open the page on claude.ai while signed in.", true);
      render();
      return;
    }
    state.db = db;
    db.collection("decisions").onSnapshot(snap => {
      state.decisions = new Map(snap.docs.map(d => [d.id, d.data()]));
      render();
    }, () => setStatus("Lost the connection to your saved choices. Reload the page.", true));
    for (const kind of ["outreach", "events"]) {
      db.collection(kind).onSnapshot(snap => {
        state.marks[kind] = new Map(snap.docs.map(d => [d.id, d.data()]));
        render();
      }, () => setStatus("Lost the connection to your saved choices. Reload the page.", true));
    }
    render();
  }
  boot();
})();
</script>
